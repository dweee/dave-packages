name: Dave packages others
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to diagnose
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose-arm-schildi:
    if: inputs.package == 'schildi-revenge'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        revision: [catalog-lock, owner-tested]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        with:
          source-tag: v3.24.1
          summarize: false
          kvm: false
          extra-conf: |
            experimental-features = nix-command flakes parallel-eval
            eval-cores = 2
            accept-flake-config = false
            max-jobs = 1
            cores = 1
            connect-timeout = 20
      - name: Build Schildi on a native ARM runner with build logs
        env:
          SCHILDI_REVISION: ${{ matrix.revision }}
        run: |
          df -h / /nix
          free -h
          flags=()
          if [[ "$SCHILDI_REVISION" == owner-tested ]]; then
            flags+=(--override-input schildi-revenge 'git+https://github.com/dweee/schildi-revenge.git?ref=tested&rev=019b74e8fc9339f314d8ef7797468e5447914c76&submodules=1')
          else
            flags+=(--no-update-lock-file)
          fi
          nix build '.#packages.aarch64-linux.schildi-revenge^*' "${flags[@]}" --fallback --no-write-lock-file --no-link --print-out-paths -L
      - name: Record runner resource availability
        if: always()
        run: |
          df -h / /nix
          free -h
