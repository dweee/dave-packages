name: GeoIP updates
# Reuse the guarded routine package publisher; keep explicit cache-only
# maintenance separate from pin discovery and PR publication.
"on":
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      cache_only:
        description: Cache the current pins without updating pins or opening a PR
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: geoip-updates
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ inputs.cache_only != true }}
    uses: ./.github/workflows/package-updates.yml
    with:
      handler: geoip
    secrets: inherit
  update:
    if: ${{ github.ref == 'refs/heads/main' && inputs.cache_only == true }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      cache_ready: ${{ steps.cache_transfer.outcome }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
        with:
          source-tag: v3.24.1
          summarize: false
          kvm: false
          extra-conf: |
            experimental-features = nix-command flakes parallel-eval
            eval-cores = 2
            accept-flake-config = false
      - name: Check public GeoIP graphs before cache access or export
        run: |
          python3 ci/public-closure.py .#packages.x86_64-linux.byparr.geoipMmdbZip
          python3 ci/public-closure.py .#packages.x86_64-linux.trawl.camoufox-bin.geoip
      - name: Configure read-only Niks3 access with GitHub OIDC
        run: python3 ci/configure-niks3.py --oidc
      - name: The GeoIP files download with their new hashes
        # Both are fixed-output downloads, the same on every system; trawl is x86_64-linux only.
        run: >-
          python3 ci/retain-build-outputs.py
          --target .#packages.x86_64-linux.byparr.geoipMmdbZip
          --target .#packages.x86_64-linux.trawl.camoufox-bin.geoip
          --manifest cache-outputs.txt -- nix build --no-link --print-out-paths
          .#packages.x86_64-linux.byparr.geoipMmdbZip
          .#packages.x86_64-linux.trawl.camoufox-bin.geoip
      - name: Remove private reader before exporting build data
        if: ${{ always() }}
        run: python3 ci/configure-niks3.py --cleanup
      - name: Export completed public GeoIP graph outputs
        id: cache_transfer
        if: ${{ always() && !cancelled() && hashFiles('cache-outputs.txt') != '' }}
        run: python3 ci/transfer-attic.py export --directory geoip-transfer --manifest cache-outputs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && !cancelled() && steps.cache_transfer.outcome == 'success' }}
        with:
          name: geoip-${{ github.sha }}
          path: geoip-transfer/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: update
    if: ${{ always() && !cancelled() && needs.update.outputs.cache_ready == 'success' && vars.NIKS3_PUSH_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
        with:
          source-tag: v3.24.1
          summarize: false
          kvm: false
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: geoip-${{ github.sha }}
          path: geoip-transfer
      - name: Read Niks3 before installing the pinned publisher
        run: python3 ci/configure-niks3.py --oidc
      - name: Install pinned Niks3 publisher
        run: bash ci/install-niks3.sh --retain-bootstrap
      - name: Publish completed bootstrap graph
        run: python3 ci/push-niks3.py --outputs niks3-bootstrap-outputs.txt
      - name: Import public data and publish with S3 integrity verification
        run: |
          python3 ci/transfer-attic.py import --directory geoip-transfer
          python3 ci/push-niks3.py --outputs geoip-transfer/outputs.txt
      - name: Remove job-local Niks3 reader
        if: ${{ always() }}
        run: python3 ci/configure-niks3.py --cleanup
