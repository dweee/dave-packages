name: Determinate plan evaluation
on:
  pull_request:
    paths:
      - .github/workflows/determinate-plan-smoke.yml
      - .github/workflows/others-actions.yml
      - .github/workflows/darwin-actions.yml
      - .github/workflows/cache-only.yml
      - ci/changed-matrix.py
      - ci/test-changed-matrix.py
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
        with:
          source-tag: v3.24.1
          summarize: false
          kvm: false
          extra-conf: |
            experimental-features = nix-command flakes parallel-eval
            eval-cores = 2
            accept-flake-config = false
      - name: Verify evaluator, daemon and real derivation selection
        run: |
          set -euo pipefail
          nix --version | grep -F 'Determinate Nix 3.24.1'
          nix store info --store daemon --json
          python3 ci/test-changed-matrix.py
