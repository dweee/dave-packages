name: Dave packages cache only
"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Approved cache-only package, or all
        required: true
        default: all
        type: string
permissions:
  contents: read
concurrency:
  group: dave-cache-only-${{ github.ref }}-${{ inputs.package || 'all' }}
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ vars.DAVE_PACKAGES_CI_ENABLED == 'true' && vars.ATTIC_PUSH_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_jobs: ${{ steps.matrix.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check portable publication metadata
        run: python3 ci/test-public-source.py
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: "2.34.7"
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Test derivation selection
        run: python3 ci/test-changed-matrix.py
      - id: matrix
        env:
          SELECTED_PACKAGE: ${{ inputs.package || 'all' }}
        run: |
          matrix=$(python3 ci/changed-matrix.py cache-only --package "$SELECTED_PACKAGE")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build-and-publish:
    needs: plan
    if: ${{ needs.plan.outputs.has_jobs == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    name: Cache only ${{ matrix.package }} (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reclaim unused Linux SDK space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Add swap so Keyguard's Gradle compile cannot kill the runner
        if: matrix.package == 'keyguard' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The hosted image already swaps on /swapfile (3 GiB). fallocate of
          # that path fails with "Text file busy". Keyguard still needs more
          # headroom on the ARM runner, which was getting SIGTERM around 11 minutes.
          if ! swapon --show | grep -q '/mnt/keyguard.swap'; then
            sudo dd if=/dev/zero of=/mnt/keyguard.swap bs=1M count=4096 status=none
            sudo chmod 600 /mnt/keyguard.swap
            sudo mkswap /mnt/keyguard.swap
            sudo swapon /mnt/keyguard.swap
          fi
          free -h
          swapon --show
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: "2.34.7"
          enable_kvm: false
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            substituters = https://cache.nixos.org/
            extra-substituters =
            max-jobs = 1
            cores = ${{ matrix.package == 'keyguard' && '1' || '3' }}
      - name: Configure authenticated private reads
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: python3 ci/configure-attic-read.py
      - name: Build and publish directly to private flakey
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
          TARGET_PACKAGE: ${{ matrix.package }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: python3 ci/build-cache-only.py
      - name: Remove runtime read credential
        if: always()
        run: rm -f "$RUNNER_TEMP/flakey-attic.netrc"
